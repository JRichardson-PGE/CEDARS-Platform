# Help for each page (cedars/core/page_help.py): cost-effectiveness runs, results, comparisons, Edit inputs and output templates.

calculations/runs:
  title: Your runs
  guide:
    - >-
      Your cost-effectiveness runs and your organization's, newest first, with their status. Any job can be priced on the ReCET engine:
      upload it as one .zip of Measure.csv and, optionally, ProgramCost.csv, the way CET takes a job, or as ReCET's job workbook (.xlsx).
    - A run is yours alone or your organization's, as you choose when you start it. Runs a filing starts (budgets, claims, monthly
      reports) are listed here too.
  how:
    - New run starts one: upload the job zip or workbook, choose the ACC and who the run is for.
    - Output templates choose the columns a run writes. Open a run for its status, files and results.
    - Under each run's name are its settings (what differs from New run's defaults, the cost-test set and the output format) and,
      once it has ended, the day retention deletes it. An input check (Check the inputs only) is tagged so. Run time is how long the
      engine took.
  see: calculations
  tour:
    - target: main .head-row .actions
      title: New run and output templates
      text: Start a run, or choose the columns runs write with an output template.
    - target: main table.list, main .empty
      title: The runs
      text: Each run's name with its settings and deletion date, who it is for, the engine and ACC, its status and run time. Select a name to open its page.

calculations/new:
  title: Starting a run
  guide:
    - From a run's page, Rerun with different settings opens this page filled in from that run, using its job file and the optional input
      files you keep ticked unless you upload others.
    - Upload the job as one .zip holding Measure.csv and, optionally, ProgramCost.csv, or as ReCET's job workbook (.xlsx), or run a
      draft you are editing in Edit inputs.
    - >-
      ReCET's optional input files (run parameters, 8,760 electric profiles, gas monthly profiles) can be uploaded under Optional input
      files, put in the job zip (RunParameters.csv, Profiles8760.csv, GasProfiles.csv, or .parquet), or given as sheets of the workbook; a
      file uploaded on its own wins over the same table in the zip or workbook. A job's own program metadata (Programs) and statewide
      factors (SWAllocation) are not used: the program registry and the allocation version take their place, and the run's page says
      so. A CET replica takes none of the optional files.
      Choose the engine release and the ACC; the run is queued, the run page shows its progress, and its files and results when it ends.
    - A CET replica prices the job exactly as that CET release did, its errors included, for comparison and history only. It is never used
      for a filing.
  how:
    - Templates to download, at the top, gives the engine's own job workbook, Measure.csv header and optional-file templates.
    - Check the inputs only runs the input check without pricing, to see the findings first.
    - Which ACCs each engine has, under Pricing, lists the ACCs each release can price on. Which ACC applies to my filing? lists each ACC's
      budget filings and the program years whose claims use it.
    - Compare with another ACC prices the job on a second ACC too; the run's Results then has a tab for each ACC and one comparing the two.
    - First Year and Market effects are CET's own settings; Price each ACC component separately and Combined 8,760 electric load profile add
      ReCET's own outputs (a CET replica takes neither, nor an ACC comparison).
    - Priced for flags records whose ACC does not apply to their program year for claims, any filing, or one named budget filing.
    - What each cost-test set prices, under Pricing, lists the registered sets, their program years and the tests each writes. An
      analysis run may instead take a cost-test set file of your own (never a filing, or a run with filing checks or Priced for).
    - Left blank, the run's name is the job file's (or draft's) name and its ACC. A large upload shows how much has been sent.
  see: calculations
  tour:
    - target: "#input-templates"
      title: Templates
      text: The engine's own templates for the job workbook, Measure.csv and the optional input files.
      optional: true
    - target: main form
      title: The job
      text: A name for the run, who it is for (only you, or your organization), and the job's .zip or workbook.
    - heading: Pricing
      title: Pricing
      text: The engine release, the ACC and the cost-test set (or a file of your own for an analysis run). The page says when no worker is running a release.
    - target: "#acc-help"
      title: Which ACC applies
      text: Each ACC's budget filings and the program years whose claims use it; dimmed ACCs are not offered here.
      optional: true
    - heading: Optional input files
      title: Optional input files
      text: ReCET's run parameters, 8,760 electric profiles and gas monthly profiles, each a file of its own. Their columns are in ReCET's Input fields, section 4.
      optional: true
    - heading: Statewide programs
      title: Statewide programs
      text: Whether and how statewide programs are allocated to the funding PAs.
      optional: true
    - heading: Checks and outputs
      title: Checks and outputs
      text: The filing checks to run, the output format and the output template.
      optional: true

calculations/run:
  title: A run
  guide:
    - One cost-effectiveness run, its status while it is queued and running, then its settings, portfolio totals, files, and the record of
      what produced the results (the engine release, the ACC and every input's checksum), so anyone can reproduce them.
    - The input check the engine makes before pricing says what stopped the run, which measures it could not price and why, and
      every other finding. The log is what the engine printed, updated while the run runs.
    - A finished run opens its Results and can be compared with another run. Rerun with different settings starts it again as a new run,
      with its own job file and input files, once you change what you want. A small job's inputs can be opened in Edit inputs to change
      and run again.
    - Your own runs (for Only me) can be deleted with their files once they end; an organization's runs stay until retention removes them.
  how:
    - Results opens a finished run's tables; Compare with another run puts it beside a second one.
    - Stop the run ends a queued or running run. Edit inputs and rerun opens a small job's tables to change and run again.
    - Rerun with different settings opens New run filled in from this run.
    - Delete the run, at the end of one of your own ended runs, removes it and its files for good once you tick the box.
    - Download every file (.zip) takes all the run's files at once; the inputs download as they were given.
  see: calculations
  tour:
    - target: "#status-h"
      title: Status
      text: Queued, running (with its progress), finished or failed, what to do about a failure, and when retention deletes the run.
    - target: "#check-h"
      title: Input check
      text: What the engine's check before pricing found, what stopped the run and what it could not price.
      optional: true
    - target: "#settings-h"
      title: Settings
      text: What the run was asked to do, and its inputs to download.
    - target: main .head-row .actions
      title: Results and compare
      text: The results by portfolio, PA, program and measure, and a comparison with any other finished run.
      optional: true
    - target: "#totals-h"
      title: Portfolio totals
      text: The headline totals, what each number is, and every other total in the receipt.
      optional: true
    - target: "#files-h"
      title: Files
      text: Every file the run wrote, to download.
      optional: true
    - target: "#log-h"
      title: Log
      text: What the engine printed while it ran.
      optional: true
    - target: "#receipt-h"
      title: What produced these results
      text: The engine release, the ACC and the checksums of the inputs and reference data.
      optional: true
    - target: "#delete-h"
      title: Delete the run
      text: Your own ended run, and its files, removed for good.
      optional: true

calculations/results:
  title: A run's results
  guide:
    - A finished run's results at the level you choose (portfolio, PA, program, sector or measure), for the program years and PAs you pick.
      The tiles are the headline totals, with what each number is under them, and the chart shows the largest groups.
    - Choose the columns to show (Find searches their names and definitions), save them as a named view to pick again on any run's
      Results or Compare, sort by any column, filter the rows, and download the table as CSV.
  how:
    - Choose the level, program years and PAs, then Apply. Show these columns picks the columns; Clear the ticks starts from none.
    - Save the view names the columns shown; Show this view brings them back on any run. Delete a saved view removes one.
    - Filter narrows the rows; Download this table (CSV) gives what you see.
    - Compare with another run, or go back to the Run page and files.
    - A run priced on two ACCs has a tab for each ACC's tables and one for the comparison of the two portfolios.
  see: calculations
  tour:
    - target: main .head-row .actions
      title: The run and comparisons
      text: The run's page with its files, and a comparison with another finished run.
    - target: nav.subnav[aria-label="ACCs of this comparison"]
      title: The two ACCs
      text: A run compared with another ACC has each ACC's tables, and the comparison of the two.
      optional: true
    - target: main form.filters
      title: What to show
      text: The PA and the program years. Choose, then Apply.
      optional: true
    - target: "#tiles-h + dl.tiles, main dl.tiles"
      title: The headline totals
      text: Benefits, costs and ratios of what is shown. What these numbers are explains each.
      optional: true
    - target: "#chart-h"
      title: The chart
      text: The largest groups at this level.
      optional: true
    - heading: Choose columns
      title: Choose columns
      text: Your saved views, Find, and the columns group by group. Save the columns shown as a view for any run.
      optional: true
    - target: main nav.subnav
      title: Level
      text: Portfolio, PA, program, sector or measure.
      optional: true
    - target: main table.data
      title: The table
      text: Sort by a column heading, filter the rows, and download the table as CSV.
      optional: true

calculations/compare:
  title: Comparing two runs
  guide:
    - Two finished runs side by side (A and B) at the level you choose, with each value's difference. Use it to see what a change of ACC,
      engine release or inputs did. Neither run changes.
    - Choose the columns as on Results, or pick one of your saved views; filter the rows; the column definitions are under the table.
  how:
    - Choose the level and the run to compare with, then Compare.
    - Choose columns or Show this view; Filter narrows the rows.
    - Download this table (CSV) gives both runs' values and their differences.
  see: calculations
  tour:
    - target: main dl.facts
      title: The two runs
      text: Run A and run B, with their engines and ACCs.
    - target: main form.filters
      title: What to compare
      text: The other run, the PA and the program years.
    - target: main nav.subnav
      title: Level
      text: Portfolio, PA, program or sector.
      optional: true
    - heading: Choose columns
      title: Choose columns
      text: Your saved views, Find, and the columns group by group.
      optional: true
    - target: main table.data
      title: Side by side
      text: A, B and the difference for each column, with a CSV of the table.
      optional: true

calculations/engines:
  title: Engine releases
  guide:
    - For CPUC system administrators. The ReCET releases runs can use, the calculations each offers (ReCET's own and CET replicas) and the
      ACCs each has. A job asks for exactly one release and the worker refuses any other, so a run's results always name the release that
      produced them. The default is what New run offers first; a retired release keeps its runs but takes no new ones.
  how:
    - Add the release registers a ReCET release by its version.
    - Make default sets what New run offers first; Retire takes no new runs on a release and keeps its runs.
  see: calculations
  tour:
    - target: main table.list
      title: The releases
      text: Each release, the calculations and ACCs it has, and whether it is the default.
    - target: "#add-h"
      title: Add a release
      text: Register a new release by its version number.

calculations/drafts:
  title: Edit inputs
  guide:
    - Edit a small job's Measure and ProgramCost tables here, row by row, for jobs of up to a set number of measures (edit larger jobs
      offline). Each cell is checked by the engine's own input rules as you save, and the draft downloads as a job zip ready for New run.
  how:
    - Start a draft from a job's .zip or job workbook (its Measure and ProgramCost tables; a draft does not keep the job's optional
      input files, so upload them again on New run), or empty from the templates. A finished run's Edit inputs and rerun starts one from that run.
  see: calculations
  tour:
    - target: main p.alert
      title: The engine is not installed
      text: Edit inputs checks each cell with the engine's input rules, so it needs the engine on the server. Ask support.
      optional: true
    - target: main table.list
      title: Your drafts
      text: Each draft, who it is for, how many measures and when it last changed. Select one to edit it.
      optional: true
    - target: "#new-h"
      title: Start a draft
      text: From a job's .zip or workbook, or empty.
      optional: true

calculations/draft:
  title: A draft
  guide:
    - One job's tables being edited, as a spreadsheet. Measure and ProgramCost are tabs; click a cell or type to change it, paste a
      block copied from Excel, add, copy or delete rows, undo and redo. Every change is saved by itself, and the engine's cell checks
      run on every save, marking each cell to look at (a cross stops the run, ! is a warning) and listing them above the table, errors
      first. The line above the table says what the selected column means and what it changes.
    - End uses are offered and checked against the impact-profile library in force, as a run matches them. Check with the engine runs
      the engine's whole input check on the tables (impact profiles, programs, ACCs, and CEDARS' filing rules if you choose) without
      pricing, and marks the cells it names; once the tables change, its findings are listed until you check again.
    - The row-by-row view shows the same tables as pages, with a form for each row; it is the page without scripts. Run these inputs
      starts a run of the tables as they stand now; the draft stays, to edit and run again. Download gives the job zip or the job workbook.
  how:
    - Pick a cell and type, or press Enter to edit it; Enter or Tab saves it. Arrow keys move; Tab leaves the table.
    - Select cells with Shift and the arrows, then copy, paste from Excel or clear them with Delete.
    - Add a row, copy or delete the selected rows, or add a measure from eTRM, which fills a new row from an eTRM permutation.
    - Check with the engine, choosing the ACC and the filing checks, queues a check-only run; reload the page when it ends.
    - Run these inputs starts a run of the tables as they stand; Download the job zip or Download as a workbook gives them as a file. Rename the draft, or delete it.
  see: calculations
  tour:
    - target: main .head-row .actions
      title: Run or download
      text: Run these inputs, or download the job as a zip.
    - target: "#grid-summary"
      title: Input check
      text: What the engine's cell checks found, after every save. Cells to look at lists each one; select it to go to the cell.
      optional: true
    - target: main .grid-tabs
      title: Tables
      text: Measure and ProgramCost. The left and right arrows move between them.
      optional: true
    - target: main .editor-bar
      title: Rows and columns
      text: Add, copy or delete rows, undo, go to a column by name, or hide the columns that change no result.
      optional: true
    - target: "#help"
      title: What a column means
      text: The selected cell's column, what it changes, and the cell's problems first when it has any.
      optional: true
    - target: "#check-h"
      title: Input check
      text: What the engine's input rules found. Cells to look at lists each one, with a link to its row.
      optional: true
    - target: "#engine-check-h"
      title: Check with the engine
      text: The engine's whole input check of the tables, as a run makes it, with nothing priced. Its findings are marked on the cells.
      optional: true
    - target: "#table-h"
      title: The rows
      text: A page of rows. Select a row's number to edit it.
      optional: true
    - target: "#change-h"
      title: Change the draft
      text: Add a row, rename the draft, or delete it.
      optional: true

calculations/draft_etrm:
  title: Add a measure from eTRM
  guide:
    - >-
      Adds a measure row to the draft filled from one eTRM permutation. Find the measure package by its ID or name (packages in effect
      in row 1's claim year are listed first; choose Any year for the rest), then choose its offering one key at a time, in the order
      of eTRM's Measure Detail ID: offering, application type, delivery type, sector, building type, vintage, HVAC, climate zone,
      net-to-gross ID, GSIA ID and the program administrator. Each list holds only the values left after the choices above it, and a
      key with one value is chosen for you.
    - >-
      Once every key is chosen, the page shows the permutation, the fields it fills and those it leaves for you (eTRM's "Any" means the
      PA enters the actual value). Enter the number of units and add the measure. The new row opens in the row editor, where every
      field can be changed and the input check runs as on any row. Rebates, incentives and direct-install costs are the program's own.
  how:
    - Search for the package and choose it.
    - Choose each offering key and select Show the next choice, until the permutation is shown.
    - Enter the number of units and select Add the measure.
  see: calculations
  tour:
    - target: main p.alert
      title: No eTRM pack yet
      text: Until a CPUC system administrator loads eTRM's permutations, measures are added by hand.
      optional: true
    - target: "#package-h"
      title: Measure package
      text: Search by package ID or name, and the year it must be in effect.
      optional: true
    - target: "#offering-h"
      title: Offering
      text: One choice at a time; each list holds only what is left.
      optional: true
    - target: "#row-h"
      title: The measure row
      text: The permutation, what it fills and what is left for you. Enter the units and add the row.
      optional: true

calculations/draft_row:
  title: Editing a row
  guide:
    - One row of a draft's table, its fields grouped as the input templates group them. Save the row and the input check runs again; the
      row's own findings are listed above the form. Copy the row to start a similar one, or delete it.
    - An end use's box offers the end uses the impact-profile library in force has an 8,760 for, for the row's IOU and target sector; any
      name can still be typed, and the check says when the library has no profile for it.
  how:
    - Change the fields and Save the row; the input check runs again.
    - Copy the row to start a similar one, or Delete the row.
  see: calculations
  tour:
    - target: main nav.pager
      title: Rows
      text: The previous and next rows, and back to the table.
    - target: "#row-check-h"
      title: This row's input check
      text: What the input rules found in this row.
      optional: true
    - target: main form.stack
      title: The fields
      text: Each field with its definition. Save the row, copy it or delete it.

calculations/templates:
  title: Output templates
  guide:
    - An output template chooses the columns a run writes to its measure-level file, in order. Everyone's shared templates come first, then
      yours. The full table is still kept for the run's Results.
  how:
    - New template lists the columns a run writes; open one of yours to change or delete it.
    - Save the default chooses the template New run starts with.
  see: calculations
  tour:
    - target: main .head-row .button
      title: New template
      text: Start a template, or open one to change or copy it.
    - target: main table.list
      title: The templates
      text: Each template, whose it is and how many columns.
    - target: "#default-h"
      title: Default for new runs
      text: The template New run chooses for you.

calculations/template:
  title: An output template
  guide:
    - Name the template and pick its columns in the order the file should have them. The list on the left has every field a run can
      write, by kind (input, program and output fields) and output group, with a search over names and definitions; the list on the
      right is the template in file order. A column a run does not produce is left out, with a note.
    - The Columns box holds the same list as text, one per line, to paste a list into. Without scripts, the page has the Columns box and
      tick boxes under Add columns instead of the two lists.
  how:
    - Select fields on the left and Add them (or press Enter); select columns on the right and Remove them (or press Delete).
    - Move the selected columns with Move to the top, up, down or to the bottom (Alt+Up and Alt+Down), then Save the template.
    - Delete the template takes one of yours off the list.
  see: calculations
  tour:
    - target: main form .form-narrow
      title: Name
      text: The template's name, who sees it, and whether new runs start with it.
    - target: "#field-picker"
      title: Pick the columns
      text: Fields you can add on the left, filtered by kind, group or search; the template's columns in file order on the right, with buttons to add, remove and reorder. Selecting a field shows its definition below.
      optional: true
    - heading: Add columns
      title: Add columns
      text: Every column a run can write, by group. Tick them to add them to the list.
      optional: true
