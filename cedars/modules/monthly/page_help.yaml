# Help for each page (cedars/core/page_help.py): monthly reports and the 13th-month report.

monthly/index:
  title: Monthly reports
  guide:
    - Each month a program administrator reports its commitments and the year's BCA inputs so far. Spend is read from the BCA inputs and
      compared with the operating budget; savings and ratios are estimated from them and labeled as not validated.
    - Each program year lists its twelve reports with their due dates and where your organization's stand, with the whole year in one
      view and the 13th-month report generated from the year's confirmed claims.
  see: monthly-reports
  tour:
    - target: main section .head-row .actions, main section .head-row .button
      title: The year in one view
      text: Every month of a year side by side, and the 13th-month report.
    - target: main table.list
      title: The reports
      text: Each month's report, its due date and status. Select one to upload, check, price and confirm it.
      optional: true

monthly/year_new:
  title: Setting up a program year's monthly reports
  guide:
    - For CPUC system administrators. This adds twelve reports to the filing calendar, one per month. Each opens when its month ends and is
      due on the day chosen here of the month after.
  see: monthly-reports
  tour:
    - target: main form
      title: The year
      text: The program year and the due day. Every PA sees the reports on Monthly reports once it is set up.

monthly/setup:
  title: How a year's monthly reports are priced
  guide:
    - The ACC and statewide allocation version the next pricing of the year's estimates uses. Reports already priced keep the ones they
      were priced with; their run records both.
  see: monthly-reports
  tour:
    - target: main form
      title: Pricing settings
      text: Choose the ACC and allocation version and Save.

monthly/report:
  title: A monthly report
  guide:
    - One PA's report for one month, three tables (Commitments, and the year's Measure and ProgramCost so far, as a calculation run takes
      them). Upload it and CEDARS checks every record; fix what is rejected and upload again.
    - Then Price the estimates, review the report against the operating budget, and Confirm and publish. Before the due date you can
      un-confirm; after it, ask to reopen.
  how:
    - What the file holds, under the upload form, lists each table's columns and what is read from them.
    - Download every finding (CSV) names each line, record, field and rule and says how to fix it.
  see: monthly-reports
  tour:
    - target: "#now-h"
      title: The version in progress
      text: Its status, the findings by rule, and the next step, which is price, confirm, un-confirm or ask to reopen.
      optional: true
    - heading: The report
      title: The report
      text: Spend and commitments against the operating budget, and the estimates, which confirming signs off on.
      optional: true
    - target: "#upload-h"
      title: Upload
      text: The three tables as one file, or several chosen together. It replaces this version's earlier upload.
      optional: true
    - heading: What the file holds
      title: What the file holds
      text: The tables and columns, and what CEDARS reads from them.
      optional: true
    - target: "#versions-h"
      title: Versions
      text: Every version of this report, newest first.
      optional: true

monthly/version:
  title: A monthly report version
  guide:
    - One version of a PA's monthly report, by program. Spend and commitments are compared with the operating budget; savings, total system
      benefit and ratios are estimated from the year-to-date BCA inputs and labeled so. A month's spend is the change in the year-to-date
      spend, so it is known once the month before is confirmed.
  see: monthly-reports
  tour:
    - target: dl.tiles, main .tile
      title: Totals
      text: The month's and the year's spend, commitments and estimates.
      optional: true
    - target: "#programs-h"
      title: By program
      text: Each program's spend and commitments against its operating budget, and the estimates, with a CSV.
    - target: "#files-h"
      title: Files
      text: The upload and, once confirmed, the estimate run's settings.

monthly/year:
  title: A year of monthly reports
  guide:
    - Every month of a program year in one place for one PA, totals over its programs. Reports are cumulative, so each month's spend is the
      change in its year-to-date spend. A month that does not add up with the one before it is flagged.
  see: monthly-reports
  tour:
    - target: main form.filters
      title: The PA
      text: Choose the program administrator.
    - target: main table.data
      title: By month
      text: Each month's spend, commitments and estimates, with a CSV of the year.
      optional: true

monthly/closing:
  title: The 13th-month report
  guide:
    - The year's closing report, generated from the PA's confirmed claims for the year, so it always matches them. Each program's
      expenditure is compared with the operating budget, and a program whose claims do not match December's monthly report is flagged.
  see: monthly-reports
  tour:
    - target: main form.filters
      title: The PA
      text: Choose the program administrator.
    - target: main table.data
      title: By program
      text: Each program's claimed expenditure against its operating budget, with a CSV.
      optional: true
