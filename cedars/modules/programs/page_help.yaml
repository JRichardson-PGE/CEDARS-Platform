# Help for each page (cedars/core/page_help.py): the program registry.

programs/catalog:
  title: The program catalog
  guide:
    - Every program in the registry, closed ones included, one row per PrgID with its current definition. The catalog is public;
      signed in, the same filters apply.
    - Filter by text, PA, sector, status and years, or pick any other attribute under Other filters. The PA list opens to All PAs,
      its IOUs, RENs and CCAs, and statewide programs; tick whole groups or single PAs. A program's ID opens its page,
      with its versions, allocation factors, evaluations and filings. A PA's ID of a statewide program (PGE_SW_FS for SW_FS) opens the
      statewide program's page, whose definition it follows.
  how:
    - Applied filters show as chips; Remove takes one off, and with two or more a link after them clears every filter.
    - Select a column's heading to sort by it; select it again to turn the order round. The pager is above and below the list.
    - Program change requests (signed in) lists changes to locked attributes waiting for a CPUC decision.
    - A PA's administrators add their PA's programs with Add a program; CPUC system administrators add any PA's, and statewide ones.
  see: programs
  tour:
    - target: "#add-program"
      title: Add a program
      text: For a PA's administrators and CPUC system administrators. Gives a new program its PrgID and first version.
      optional: true
    - target: form.catalog-filters
      title: Search and filter
      text: Search the ID and names, choose PAs, sectors, statuses and years, then Apply.
    - heading: Other filters
      title: Other filters
      text: Any other program attribute. Choose the attribute, then its values or range, and Apply.
    - target: section.applied
      title: Applied filters
      text: What the list is filtered by. Remove one, or Reset all.
      optional: true
    - target: main table.list
      title: The programs
      text: One row per program, by PrgID. Select an ID to open the program's page.

programs/program:
  title: A program
  guide:
    - One program's definition as it stands today, every earlier version, and where it appears across CEDARS. A program is never edited
      in place; a change starts a new version on its effective date, and the version before it is kept as it was.
    - >-
      A statewide program is the source of truth for each PA's ID of it (the PA's code in front of its PrgID, e.g. PGE_SW_FS for SW_FS):
      those IDs follow its definition, their PAs do not change them, and every one of them shows the statewide program's documents and
      evaluations. Its lead PA's administrators change the statewide program, and the change reaches every ID that follows it.
    - >-
      A statewide program shows its lead PA, the only PA that files its claims and budget, and its allocation factors, the share each
      funding PA carries by year. The last section lists everything on
      record about the program, each linked to its record, for one program year or every year: budget filings by cycle, fund shifts,
      claims, monthly reports, the evaluations that cover it and the documents that name it.
  how:
    - >-
      The program's own administrators change it with Change this program (for a statewide program, its lead PA's administrators). A
      change to a locked attribute goes to a CPUC approver as a request; the page says when one is waiting. An ID that follows a
      statewide program has no Change this program: change the statewide program.
    - Add a document files a document in the library with the program already named, for anyone who files documents for their
      organization. On an ID that follows a statewide program, the document names the statewide program, so every ID of it shows it.
    - Signed in, Follow this program sends you a notice when a filing that includes it is published or corrected, a fund shift moves its
      funds, its details change or a document about it is published. Your notification settings choose which of these you hear about.
    - Without signing in you see what is published. A PA's own staff and CPUC staff also see filings not yet published and fund shifts.
    - A statewide program's lead PA is recorded under Lead PA, with a reason. While it has none, any program administrator's administrators
      can record one; after that only the lead PA's administrators can change it, for example to hand it to another PA.
    - >-
      Correct, in the Versions table, puts right a value a version holds wrongly (a typo, a sector an import got wrong) without starting a
      new version. CPUC system administrators and programs approvers correct directly; a program's administrators send a correction as
      a request for an approver's decision. An ID that follows a statewide program is corrected through the statewide program.
  see: programs
  tour:
    - target: "#program-sections"
      title: On this page
      text: The page's sections, each one link away, from the definition to the documents that name the program.
    - target: "#def-h"
      title: The definition
      text: The program's attributes in force today, and since when.
    - target: main .head-row .actions
      title: Change, add a document or follow
      text: >-
        The program's administrators change it here; the change starts a new version on the date you give. Add a document files one
        about the program. Anyone signed in can follow it.
    - target: "#follows-note"
      title: Part of a statewide program
      text: This ID follows its statewide program's definition, documents and evaluations. Its filings and reports are its own.
      optional: true
    - target: "#ver-h"
      title: Versions
      text: Every version of the program, what changed in each and why, and when a version was corrected. Correct puts a version's values right.
    - target: "#alloc-h"
      title: Statewide allocation
      text: For a statewide program, each funding PA's share by version and year, and its lead PA.
    - target: "#ids-h"
      title: Each PA's ID
      text: For a statewide program, each PA's ID of it and whether it follows this program's definition.
      optional: true
    - target: "#rec-h"
      title: Filings, reports and documents
      text: Everything on record about the program. Choose a program year and Show, or see every year.
    - target: "#bud-h"
      title: Budget filings
      text: Each cycle's budget filings that include the program, with its budget in each.
      optional: true
    - target: "#shift-h"
      title: Fund shifts
      text: Fund shifts with lines on the program.
      optional: true
    - target: "#claim-h"
      title: Claims
      text: Claims confirmations that include it, newest year first.
      optional: true
    - target: "#mon-h"
      title: Monthly reports
      text: Monthly reports that include it, newest month first.
      optional: true
    - target: "#eval-h"
      title: Evaluations
      text: The EM&V studies that evaluate the program, and the program years each covers.
      optional: true
    - target: "#doc-h"
      title: Documents
      text: Documents that name the program, newest first.
      optional: true

programs/change:
  title: Changing a program
  guide:
    - Your change starts a new version of the program on its effective date; the version before it ends the day before and is kept. The
      date may be in the future, but not on or before the day the latest version started. Only the attributes you change are recorded as
      changed, with your reason.
    - Locked attributes are listed above the form. A change that touches one goes, with the rest of the change, to a CPUC approver as a
      request, and nothing changes until it is approved.
    - >-
      Under each field is how to fill it in, with a link to its entry in Program fields (its definition and valid values). Status,
      segment, primary sector, implementer and category offer only the listed values; a program that already carries a retired value
      keeps it on offer.
    - Delivery holds how the program is delivered (resource, deemed, custom, upstream, midstream, downstream, audit, direct install,
      financing), as CEDARS' Programs list records it. Untick a box to record that the program no longer has it.
    - To put right a value an existing version holds wrongly, correct that version from the program's Versions table instead.
  how:
    - Choose the effective date, change the attributes, give the reason, and Save the change.
    - A change to a locked attribute goes to a CPUC programs approver as a request.
  see: programs
  tour:
    - target: main form
      title: The change
      text: The effective date, the attributes to change and why. Save the change, or Cancel.
    - heading: Delivery
      title: Delivery
      text: How the program is delivered. Tick each that applies.

programs/new:
  title: Adding a program
  guide:
    - >-
      A new program gets its PrgID and a first version from the day it starts. The PrgID is kept for good and never reused, even by
      a closed program, in any mix of capitals; it starts with its PA's code (a statewide program's with SW_) and holds only letters,
      digits, underscores and hyphens.
    - A PA's administrators add their own PA's programs. CPUC system administrators add any PA's, and statewide programs.
    - >-
      A PA's ID of a statewide program (the PA's code in front of the statewide PrgID, e.g. PGE_SW_FS for SW_FS) follows the statewide
      program from the start: its attributes are copied from it, so the ones entered here are not used and no name is needed.
    - Later changes start new versions from the program's page with Change this program.
  how:
    - Choose the PA, write the PrgID, the day it starts and the reason (the decision or advice letter that approved it), fill in its
      attributes and delivery, and Add the program.
  see: programs
  tour:
    - target: "#id_administrator"
      title: The PA
      text: Whose program it is. CPUC system administrators can also choose SW, a statewide program.
    - target: "#id_prg_id"
      title: The PrgID
      text: Kept for good. It starts with the PA's code.
    - heading: Delivery
      title: Delivery
      text: How the program is delivered. Tick each that applies.
    - target: main form .actions
      title: Add it
      text: Adds the program with its first version, and opens its page.

programs/correct:
  title: Correcting a version
  guide:
    - >-
      A correction puts right values a version holds wrongly, such as a typo or a sector an import got wrong. The version keeps its
      dates; it shows when it was corrected and by whom, and the audit trail keeps the values it had, with the reason. Filings and
      published results keep the values they were filed with.
    - >-
      CPUC system administrators and programs approvers correct a version directly. A program's own administrators send the correction
      as a request, and nothing changes until a CPUC programs approver approves it.
    - Correcting a statewide program's version brings each PA's ID that follows it into line from the same date.
    - A real change from a date, such as a new implementer, is a change to the program, not a correction.
  how:
    - Change the values that are wrong, give the reason and where the right value comes from, and save (or send) the correction.
  see: programs
  tour:
    - target: main form
      title: The correction
      text: The version's values. Change only what is wrong and say why.
    - heading: Delivery
      title: Delivery
      text: How the program is delivered, as this version records it.

programs/requests:
  title: Program change requests
  guide:
    - Changes to locked program attributes that a program's administrators asked for, waiting for a CPUC programs approver's decision,
      and the ones already decided, newest first. Filter by status; select a column's heading to sort by it.
    - A program's administrators change most attributes themselves. Approving a change starts the new version on the date asked for;
      approving a correction corrects that version in place.
  see: reviewing
  tour:
    - target: main form.filters
      title: Filter
      text: By status (waiting, approved, declined, withdrawn) or by program.
    - target: main table.list
      title: The requests
      text: Each request, its program, its effective date and where it stands. Select one to see what would change.

programs/request:
  title: A program change request
  guide:
    - What a change to a program would do, attribute by attribute, before and after, and who asked for it and why. A CPUC programs
      approver approves or declines it with a reason; the PA that asked may withdraw it while it waits.
  how:
    - A CPUC programs approver decides the request, with a reason; the PA that asked may Withdraw the request while it waits.
  see: reviewing
  tour:
    - target: main table.list
      title: What would change
      text: Each attribute the request changes, as it is now and as it would be.
    - target: "#decide-h"
      title: Decide
      text: For CPUC programs approvers. Approving starts the new version on its effective date.
      optional: true
    - target: "#withdraw-h"
      title: Withdraw
      text: For the PA that asked, while the request waits.
      optional: true
    - target: "#hist-h"
      title: History
      text: Who asked, who decided, and when.

programs/fields:
  title: Program fields
  guide:
    - >-
      Every field of a program's definition, in the order a program's page shows them: what the field means, how to fill it in, and the
      values it takes. Where the data dictionary has the field, its definition is the dictionary's, linked to its entry there.
    - >-
      A field with a list of values says which ones are offered and how many programs carry each. A retired value stays on the versions
      that have it and is no longer offered to other programs; values on record that the list lacks are named under the table.
    - >-
      Status, segment, primary sector, implementer and category take their values from value lists that CPUC system administrators
      keep on the data dictionary's Value lists pages, in versions with the date each takes effect; each field links to its list.
  how:
    - Pick a field under Fields to go to it. Each field's name on a program's page links here too.
    - A locked field says so; a change to it goes to a CPUC programs approver as a request.
  see: programs
  tour:
    - target: "#toc-h"
      title: Fields
      text: Every field of the program record. Pick one to go to it.
    - target: "#field-status"
      title: One field
      text: Its definition, where it comes from in CEDARS' Programs list, who sets it, how to fill it in and its valid values.
    - heading: Valid values of Status
      title: Valid values
      text: Each value with its meaning, whether it is offered and how many programs carry it.

programs/locked:
  title: Locked program attributes
  guide:
    - The program attributes a PA changes only through a request that a CPUC programs approver decides. CPUC system administrators and
      programs approvers change them directly; every other attribute stays with the program's administrators.
    - A policy starts today or later and is never edited; the ones before it are kept, so what was locked on any date can be seen.
  how:
    - Tick the locked attributes, choose the date the policy starts, give the reason, and Save the policy.
  see: programs
  tour:
    - heading: In force today
      title: In force today
      text: The attributes locked now.
    - heading: Policies
      title: Policies
      text: Every policy, newest first, with what it locks, why and who set it.
    - target: "#set-h"
      title: Set a new policy
      text: For CPUC administrators. Choose the attributes, the start date and the reason.
      optional: true
