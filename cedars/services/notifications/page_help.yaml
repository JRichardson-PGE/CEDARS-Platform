# Help for each page (cedars/core/page_help.py): notifications.

notifications/index:
  title: Notifications
  see: getting-started
  guide:
    - What needs you, a filing to review, an access request, a due date coming up, a run or download that finished, a document published,
      newest first. New ones are marked; the count in the header is how many are unread.
    - The same notices go by email unless you turn that off in the settings.
  how:
    - Open a notice to go where it points; Mark all as read clears the count.
    - Choose what you hear about, and what is emailed, in the settings.
  tour:
    - target: main .page-title + p
      title: Unread and settings
      text: How many are unread, and a link to choose what you are sent.
    - target: main ul.notices
      title: Your notifications
      text: Each with its link, when it came and whether it was emailed. Mark all as read when you have seen them.
      optional: true

notifications/settings:
  title: Notification settings
  see: getting-started
  guide:
    - Choose what you hear about, and for each whether it is emailed too. Everything you choose appears on your notifications page. Filing
      events reach you only for organizations you belong to.
    - Each group of events is a table with three columns, Off, the notifications page, and the page and email. Set every event in this
      group changes the whole group at once.
  how:
    - Pick a column for each event, or set the whole group, then Save. The Save button stays at the bottom of the window.
    - Under Requests, choose how you hear the decision on your own requests and of requests waiting on you (on by default).
  tour:
    - target: main .event-group
      title: A group of events
      text: One row an event, one column a way of hearing about it. Set every event in this group changes them all at once.
    - target: main .save-bar
      title: Save
      text: Saves everything on the page.
    - heading: Requests
      title: Requests
      text: How you hear the decision on a request you made, and of a request waiting for your decision. On, with email, unless you change it.
