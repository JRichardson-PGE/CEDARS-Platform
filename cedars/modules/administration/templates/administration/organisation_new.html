{% extends "core/base.html" %}
{% block title %}Add an organisation{% endblock %}
{% block content %}
<h1>Add an organisation</h1>
<form method="post" class="stack form-narrow">{% csrf_token %}
  {% if form.non_field_errors %}<div class="alert" role="alert">{{ form.non_field_errors }}</div>{% endif %}
  {% for field in form %}{{ field.as_field_group }}{% endfor %}
  <div class="actions"><button type="submit" class="primary">Add</button> <a href="{% url 'administration:organisations' %}">Cancel</a></div>
</form>
{% endblock %}
