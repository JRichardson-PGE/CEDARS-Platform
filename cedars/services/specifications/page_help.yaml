# Help for each page (cedars/core/page_help.py): filing specifications.

specifications/index:
  title: Filing specifications
  guide:
    - What each kind of filing must contain (quarterly claims, budget and application filings, monthly reports), with its tables, the
      fields of each table, which are required, each field's type and value list, and the rules and built-in checks every record is
      checked against.
    - The CPUC publishes each specification in named versions. A published version never changes. Each filing set (a claim year, a
      budget filing, a year of monthly reports) is set up with one version, and its uploads and corrections use that version whenever
      they are made, so several versions can be in use at once.
  how:
    - Select a version to read its tables, fields and rules and to download its template.
    - Compare two versions shows the fields, rules and settings that change between them.
  see: rules-and-lists
  tour:
    - target: main p.actions
      title: Compare two versions
      text: See what changes from one version to another, or between two specifications' tables.
    - target: main section table.list
      title: Versions
      text: Each version of the specification, its status, when it was published and how many filings on the calendar use it.

specifications/version:
  title: A filing specification version
  guide:
    - One version of a filing specification, which filings set up with it are checked against. Its tables come in upload order; each
      field shows whether it is required, its type, its value list and its definition, and the rules about the field open in place.
    - Built-in checks are the checks written in CEDARS' code that need more than one record can show, such as the program registry or
      earlier quarters. A finding on a validation report names the rule or check by its ID.
    - The template, the fields-and-rules workbook, the JSON and each table's JSON Schema are made from this version, so they always
      match it.
  how:
    - Download the upload template (a workbook, or a .zip of pipe-delimited files) and fill in each table.
    - Open a field's rules to read them as sentences with their suggested fixes.
    - Compare with another version to see what changed.
  see: rules-and-lists
  tour:
    - target: "#spec-status"
      title: Status
      text: Whether the version is published or withdrawn, when, and whether new filings are set up with it.
    - target: "#downloads-h"
      title: Templates and downloads
      text: The upload template, every field and rule as a workbook, and the whole specification as data.
    - target: "#about-h"
      title: About this version
      text: Its rules, what prices its filings, its file format and the filings that use it.
    - target: main section.spec-table
      title: A table and its fields
      text: Each field's requirement, type, value list and definition. Open a field's rules to read them.
    - target: "#checks-h"
      title: Built-in checks
      text: The checks written in CEDARS' code that a filing on this version also meets.

specifications/compare:
  title: Compare two specification versions
  guide:
    - What changes from one version to another, as tables, fields and their attributes, rules, built-in checks and settings added,
      removed or changed. Two versions of different specifications can be compared too; tables are matched by name.
  how:
    - Choose the version to compare from and the one to compare to, then Compare.
  see: rules-and-lists
  tour:
    - target: main form.filters
      title: Choose two versions
      text: The version to compare from and the one to compare to.
    - target: "#result-h"
      title: What changes
      text: Tables, fields, rules, built-in checks and settings that are added, removed or changed.
      optional: true

specifications/edit_fields:
  title: A draft's tables and fields
  guide:
    - The tables of a draft specification version and their fields, in template order, with each field's requirement, type, value list
      and whether it is locked. Nothing here is used by a filing until the draft is published.
    - A locked field is one the engine reads to price a record or CEDARS' own processing reads (a key, a program ID, a year and
      quarter, a link to the PII vault). It stays in the version with its type, and a required one stays required; its wording, example
      and other accepted names can change.
  how:
    - Add a field to a table from the data dictionary, or a new one with its definition.
    - Select Change beside a field to change its requirement, type, value list, wording or place, to rename it, or to remove it.
    - A field another specification renamed in the data dictionary is listed at the top: rename it here too, or keep the name.
    - The value lists made in the draft for new codes are listed at the top; open one to change its codes or load them from a CSV.
    - Change a table's other accepted names and the guidance shown above its fields.
  see: rules-and-lists
  tour:
    - target: "#draft-status"
      title: The draft
      text: What it was copied from, and how many things are left to settle before it can be published.
    - target: main nav.subnav
      title: Parts of the draft
      text: A page for each part of the draft, from its settings to Publish.
    - target: "#pending-renames"
      title: Renamed in the data dictionary
      text: Fields another specification renamed; rename each here too, or keep its name.
      optional: true
    - target: "#made-lists"
      title: New value lists
      text: The lists made in this draft for new codes, published with it.
      optional: true
    - target: main section.spec-table
      title: A table and its fields
      text: Each field's requirement, type, value list and lock. Add a field, or change one from its row.

specifications/edit_settings:
  title: A draft's settings
  guide:
    - The draft's name (fixed once it is published and shown to filers everywhere), its summary, and what prices its filings, the engine
      release and the cost-test set. Every filing on the version is priced with them, the first time and on every later correction.
    - Moving to another engine release or cost-test set is a new version even when no field or rule changes.
  how:
    - Change the name, the summary, the engine release or the cost-test set, say why, and save.
  see: rules-and-lists
  tour:
    - target: "#settings-form"
      title: The settings
      text: Name, summary, engine release and cost-test set, and why they change.

specifications/edit_rules:
  title: A draft's rules
  guide:
    - The rules a filing on the draft version will be checked against. They are a draft copy of the rules of the version it was copied
      from, kept in the rule library and published with the version on the day it takes effect.
    - Field requirements, types, lengths and value lists are checked from the fields themselves and need no rule.
  how:
    - Add a rule, or open a rule to change its test or wording or to take it out.
    - What the rules change compares them with the rules of the version the draft was copied from.
  see: rules-and-lists
  tour:
    - target: "#draft-rules"
      title: The draft's rules
      text: Where they come from and how they are published.
    - target: main table.list
      title: Rules
      text: Each rule with its severity, table, field, message and suggested fix.
      optional: true

specifications/edit_checks:
  title: A draft's built-in checks
  guide:
    - The checks written in CEDARS' code that a filing on the draft version meets beside its rules, because they need what a rule
      cannot see, such as the program registry, earlier quarters or eTRM.
    - Most are CEDARS' own processing (columns, keys and IDs, programs, the links between tables) and always run. A few, such as
      CEDARS' data rules on the Claim and Site tables and the warnings about program costs, can be left out of a version or made a
      warning or a reject. A filing on the version runs them as the version has them, the first time and on every correction.
  how:
    - Untick Runs to leave a check out of the version, or tick it to put it back.
    - Choose whether a check rejects the record or only warns.
    - Say why, and save. What changes lists it for the release note.
  see: rules-and-lists
  tour:
    - target: "#draft-checks"
      title: Built-in checks
      text: What they are, and which can change.
    - target: "#checks-form"
      title: The checks
      text: Each filing's checks; Runs and Severity can change where a version may choose them.

specifications/edit_changes:
  title: What a draft changes
  guide:
    - What the draft changes from the version it was copied from, worked out by CEDARS (fields added, removed and changed, rules,
      built-in checks and settings). The sentences at the top are offered as the release note's text when the draft is published.
  see: rules-and-lists
  tour:
    - target: "#result-h"
      title: What changes
      text: Every difference from the version the draft was copied from.
    - target: "#note-h"
      title: In the release note
      text: The sentences offered as the release note's text.
      optional: true

specifications/edit_publish:
  title: Publish a draft
  guide:
    - The checks a draft must pass before it is published, and the form that publishes it. Publishing freezes the version for good,
      publishes its rules with it and publishes a release note that announces it.
    - A version takes effect at least the usual notice after the day it is published, unless a reason is given and shown with it.
      Filing sets set up from that day use it; filings already set up keep their version for every later upload and correction.
  how:
    - Settle each check that is not passed; each links the part of the draft it is in.
    - Choose the day it takes effect, word what changes and what filers need to do, then publish.
    - Discard the draft, with its rules, if it is not wanted.
  see: rules-and-lists
  tour:
    - target: "#checks-h"
      title: Checks before publishing
      text: What is still to settle, or that the draft passes.
    - target: "#publish-form"
      title: Publish
      text: The day it takes effect, the release note's words, and the button.
    - target: "#discard"
      title: Discard
      text: Drop the draft and its rules; nothing a filing uses changes.

specifications/edit_field:
  title: Add or change a field of a draft
  guide:
    - A field of a draft specification version. Its type comes from a fixed list, and each type brings its own check and its own words
      on the specification pages. A coded field names the value list whose codes are accepted.
    - A locked field keeps its type, and a required one stays required. A field required only in some cases is optional here, with a
      rule that says when.
  how:
    - Set the requirement, type, size, value list, example and wording, say why, and save.
    - To add a field, pick one the data dictionary has or give a new name and definition.
    - Rename a field that is not locked; it stays the same field, its old name is still accepted on upload, its rules follow it and
      the data dictionary renames it when the version is published.
    - Remove a field that is not locked; data filed under earlier versions keeps it.
    - For new codes no list has, make a new value list for a field that is not locked; give its name and codes, one to a line. It is
      published with the version, and a value not in it is rejected.
  see: rules-and-lists
  tour:
    - target: "#field-form"
      title: The field
      text: Requirement, type, value list, example, wording and its place in the template.
    - target: "#field-lock"
      title: Locked
      text: Why the field is locked and what may still change.
      optional: true
    - target: "#rename-field"
      title: Rename the field
      text: A new name for the same field; the old name is still accepted.
      optional: true
    - target: "#remove-field"
      title: Remove the field
      text: Take it out of the draft, with the reason.
      optional: true
    - target: "#new-value-list"
      title: A new value list
      text: New codes for the field, in a list published with the version.
      optional: true

specifications/edit_table:
  title: A draft table's names and guidance
  guide:
    - The other names a file or sheet may give a table of a draft, and the guidance shown above its fields. Its key, how a later upload
      replaces its records and whether it is kept in the PII vault are CEDARS' processing and stay as they are.
  how:
    - Change the other names (separated by commas) or the guidance, say why, and save.
  see: rules-and-lists
  tour:
    - target: "#table-facts"
      title: The table
      text: What stays as it is.
    - target: "#table-form"
      title: Names and guidance
      text: What a file or sheet may be called, and what filers read above the fields.
