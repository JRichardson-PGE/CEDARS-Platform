# Help for each page (cedars/core/page_help.py): monthly reports and the 13th-month report.

monthly/index:
  title: Monthly reports
  guide:
    - Each month a program administrator reports its commitments and the year's BCA inputs so far. Spend is read from the BCA inputs and
      compared with the operating budget; savings and ratios are estimated from them and labeled as not validated.
    - Each program year lists its twelve reports with their due dates and, when you act for a PA, where its reports stand, with the
      whole year in one view and the 13th-month report generated from the year's confirmed claims.
  how:
    - Monthly report template (Excel) is the workbook to fill in, Commitments, Measure and ProgramCost with a Fields sheet defining
      every column.
    - The change log lists every correction to a published monthly report, each with a change letter.
    - When you act for a PA, the next report to file is marked "Next to file", and each month ends with what to do on it (Start,
      Continue, or Open one that is confirmed).
  see: monthly-reports
  tour:
    - target: main > .head-row > .actions
      title: The template and the change log
      text: The monthly report template to fill in, and every correction to a published report. CPUC administrators set up a program
        year's reports here too.
    - target: main section .head-row .actions, main section .head-row .button
      title: The year in one view
      text: Every month of a year side by side, and the 13th-month report.
    - target: main table.list
      title: The reports
      text: Each month's report, its due date and status, the next one to file marked. Select one to upload, check, price and confirm it.
      optional: true

monthly/year_new:
  title: Setting up a program year's monthly reports
  guide:
    - >-
      For CPUC system administrators. This puts one whole program year on the filing calendar: thirteen due dates, one for each
      month's report and the 13th-month report's, due with the year's annual claim. Each month's report opens when its month ends;
      the 13th-month report, generated from each PA's confirmed claims, opens when the year ends.
    - A due date can be moved afterwards on the filing calendar, with a reason.
  how:
    - Choose the program year and the ACC, enter the thirteen due dates, then Set up the year.
  see: monthly-reports
  tour:
    - target: main form
      title: The year
      text: The program year and what its estimates are priced on. Every PA sees the reports on Monthly reports once it is set up.
    - target: "#due-dates"
      title: Due dates
      text: Each month's report is due after its month ends; the 13th-month report is due with the annual claim.
    - target: "#id_filers"
      title: Who files
      text: Every PA is ticked; untick those not expected to file. Only those ticked can start a filing and are on the Filings page's status.

monthly/setup:
  title: A year of monthly reports' set-up
  guide:
    - The ACC and statewide allocation version the next pricing of the year's estimates uses. Reports already priced keep the ones they
      were priced with; their run records both.
    - Its due dates still to come change here as on the filing calendar, with a reason (those who follow the calendar are told, and
      reminders are sent again); a date already passed moves on its own page of the calendar. While no PA has started filing for it,
      Remove this set-up takes it off the calendar for good, set-up and deadlines, for one set up by mistake.
    - Not every program administrator files every filing. Who files lists those expected to, and only they can start a filing for it, and
      only they are listed on the Filings page's status. A PA that has started filing stays on it, since what it filed is kept.
    - >-
      Filings in this set lists each filing the set-up put on the calendar and whether it is on the calendar or canceled. Any one of
      them that no organization has started can be canceled with a reason, leaving the rest of the set as it is: no filing starts for
      it and no reminders are sent. A canceled filing is restored the same way.
  how:
    - Choose the ACC and the allocation version, then Save. The next pricing uses them.
    - To move due dates, change them under Due dates, give the reason and Save the due dates.
    - To remove the set-up, give the reason under Remove this set-up and press its button. It can be set up again afterward.
    - To change who files, tick or untick program administrators under Who files, give the reason and Save who files. A PA that has
      started filing stays on it.
    - To cancel one filing, choose it under Cancel one filing, give the reason and press Cancel the filing; to bring one back, choose
      it under Restore a canceled filing.
  see: monthly-reports
  tour:
    - target: "#setup-pricing"
      title: Pricing settings
      text: Choose the ACC and allocation version and Save.
    - target: "#setup-filings"
      title: Filings in this set
      text: Each filing in the set, on the calendar or canceled. Cancel one no organization has started, or restore one.
    - target: "#setup-due-dates"
      title: Due dates
      text: Every due date still to come, changed here as on the filing calendar.
    - target: "#setup-filers"
      title: Who files
      text: Tick the program administrators expected to file; only they can start a filing and only they are on the Filings page's status.
    - target: "#remove-setup"
      title: Remove this set-up
      text: Takes it off the calendar while nobody has filed for it; once someone has, it stays.

monthly/report:
  title: A monthly report
  guide:
    - One PA's report for one month, three tables (Commitments, and the year's Measure and ProgramCost so far, as a calculation run takes
      them). Upload it and CEDARS checks every record; fix what is rejected and upload again.
    - Then Price the estimates, review the report against the operating budget, and Confirm and publish. Before the due date you can
      un-confirm; after it, ask to reopen.
  how:
    - What the file holds, under the upload form, lists each table's columns and what is read from them.
    - Download every finding (CSV) names each line, record, field and rule and says how to fix it.
  see: monthly-reports
  tour:
    - target: main dl.facts
      title: Due date and pricing
      text: When this report is due, and the ACC and allocation version its estimates are priced on.
    - target: "#choose-pa-h"
      title: Choose a program administrator
      text: >-
        Each PA files its own report. CPUC staff, and anyone not acting for a PA, choose one here to see its report; others' published
        versions are open to everyone signed in.
      optional: true  # only when you are not acting for a PA
    - target: "#nothing-yet"
      title: Not started yet
      text: The PA has not started this report, and you cannot upload it; its filers do that here.
      optional: true
    - target: "#now-h"
      title: The version in progress
      text: Its status, the findings by rule, and the next step, which is price, confirm, un-confirm or ask to reopen.
      optional: true
    - heading: The report
      title: The report
      text: Spend and commitments against the operating budget, and the estimates, which confirming signs off on.
      optional: true
    - target: "#upload-h"
      title: Upload
      text: The three tables as one file, or several chosen together. It replaces this version's earlier upload.
      optional: true
    - heading: What the file holds
      title: What the file holds
      text: The tables and columns, and what CEDARS reads from them.
      optional: true
    - target: "#versions-h"
      title: Versions
      text: Every version of this report, newest first.
      optional: true

monthly/version:
  title: A monthly report version
  guide:
    - One version of a PA's monthly report, by program. Spend is shown beside the approved and operating budgets; savings, total system
      benefit and ratios are estimated from the year-to-date BCA inputs and labeled so. A month's spend is the change in the year-to-date
      spend, so it is known once the month before is confirmed.
    - Paid incentives (the measures' rebates and incentives) are part of spend and shown on their own too. Committed incentives are what
      the PA has committed to pay in the future, from the Commitments table; they are not spend and not comparable with paid incentives.
  how:
    - Download this report by program (CSV) gives the table as shown.
    - Comments, at the end, is where your organization and CPUC staff discuss the filing; Post comment adds one, with files.
  see: monthly-reports
  tour:
    - target: dl.tiles, main .tile
      title: Totals
      text: The month's and the year's spend, paid and committed incentives, and estimates.
      optional: true
    - target: "#programs-h"
      title: By program
      text: Each program's approved and operating budgets, spend, paid incentives and committed incentives, and the estimates, with a CSV.
    - target: "#files-h"
      title: Files
      text: The upload and, once confirmed, the estimate run's settings.
    - target: "#comments-h"
      title: Comments
      text: Your organization and CPUC staff discuss the filing here, with files attached. Not public; a comment is never edited.
      optional: true

monthly/year:
  title: A year of monthly reports
  guide:
    - Every month of a program year in one place for one PA, totals over its programs. Reports are cumulative, so each month's spend is the
      change in its year-to-date spend. A month that does not add up with the one before it is flagged.
    - Paid incentives are part of spend; committed incentives are to be paid in the future and are not compared with them.
  how:
    - Choose the PA and the year and Apply; Download the year (CSV) gives every month.
  see: monthly-reports
  tour:
    - target: main form.filters
      title: The PA
      text: Choose the program administrator.
    - target: main table.data
      title: By month
      text: Each month's spend, paid and committed incentives, and estimates, with a CSV of the year.
      optional: true

monthly/closing:
  title: The 13th-month report
  guide:
    - The year's closing report, generated from the PA's confirmed claims for the year, so it always matches them. Each program's
      expenditure is compared with the operating budget, and a program whose claims do not match December's monthly report is flagged.
  how:
    - Choose the PA and the year and Apply; Download the 13th-month report (CSV) gives it as a file.
  see: monthly-reports
  tour:
    - target: main form.filters
      title: The PA
      text: Choose the program administrator.
    - target: main table.data
      title: By program
      text: Each program's claimed expenditure against its operating budget, with a CSV.
      optional: true

monthly/changes:
  title: Monthly reports change log
  guide:
    - Every correction to a published monthly report, newest first. A correction is a new version of a report made after it was
      published; the version it replaces stays as it was confirmed. Each correction is published with a change letter giving the date, the
      reason and each program whose spend, commitments or estimates changed.
    - Choose a program administrator or a program year, then Apply, to narrow the list.
  see: monthly-reports
  tour:
    - target: main form.filters
      title: Which corrections
      text: One PA or every PA, one program year or every year.
      optional: true
    - target: main table.list
      title: The corrections
      text: When each was published, the version it replaces, its reason and how many programs changed. Select one to read its change letter.

monthly/change_letter:
  title: A monthly report change letter
  guide:
    - What a correction to a published monthly report changed. The facts give when it was published, the version it corrects (kept as it
      was confirmed), the correction and its reason.
    - The table lists each program whose spend, commitments or estimates changed, before and after, with the total. The estimates are
      priced from the year-to-date inputs and are never part of a claim; a version that was not priced shows them blank.
  see: monthly-reports
  tour:
    - target: main dl.facts
      title: The correction
      text: Published when, which version it corrects, and why.
    - target: "#programs-h"
      title: Programs that changed
      text: Each program's spend, commitments and estimates before and after, and the difference.

