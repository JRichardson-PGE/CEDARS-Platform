# Help for each page (cedars/core/page_help.py): reference data packs and cost-test sets.

refdata/index:
  title: Reference data
  guide:
    - The data packs the engine and the modules read, ACCs, eTRM packs, the impact profile library, cost-test sets and the rest. Every
      run and every filing records the packs it used. A draft can be used for analysis runs but not for filings; a published pack is never
      changed, and a withdrawn one keeps the runs that used it.
  see: calculations
  tour:
    - heading: In force today
      title: In force today
      text: The pack of each kind that filings use today.
      optional: true
    - heading: All packs
      title: All packs
      text: Every pack, newest first within each kind. Select one for its files and tie-outs.

refdata/detail:
  title: A data pack
  guide:
    - One data pack, its status, what it holds, its files with their SHA-256 checksums, and the tie-outs it must pass before it is
      published. An eTRM pack lets you look up a permutation by its measure detail ID; a cost-test set shows its tests, the set in words
      as the engine reads it, and a link to download its file.
    - Its managers publish or discard a draft, or withdraw a published pack with a reason. Publishing needs a passed tie-out for each check
      the kind of pack requires.
  how:
    - Publish a draft once its tie-outs pass, or Discard the draft; Withdraw takes a published pack out of use, with a reason.
    - On an eTRM pack, Look it up finds a permutation by its measure detail ID.
    - On a cost-test set, Download the set file gives you its YAML, the starting point for the next set. Its engine check is recorded
      when it is registered, by the engine installed here; Check it with the engine again records it anew.
  see: calculations
  tour:
    - target: main dl.facts
      title: The pack
      text: Kind, status, ACC, source and notes.
    - target: "#set-h"
      title: The set
      text: For a cost-test set, its tests and value streams, and the link to download its file.
      optional: true
    - target: "#words-h"
      title: The set in words
      text: For a cost-test set, each test's benefits and costs as the engine adds them up.
      optional: true
    - target: "#perm-h"
      title: Permutations
      text: For an eTRM pack, look up one permutation's values.
      optional: true
    - heading: Tie-outs
      title: Tie-outs
      text: The checks this kind of pack must pass, with the latest result of each.
    - heading: Files
      title: Files
      text: Every file with its checksum.
    - target: "#act-h"
      title: Publish, discard or withdraw
      text: For the pack's managers.
      optional: true

refdata/cost_tests:
  title: Cost-test sets
  guide:
    - A cost-test definition set says which value streams each cost test adds up and how it shares the program costs. Every run is pinned to
      one. A filing is priced only on a published set, the one its filing setup names or the one in force for its first program year.
    - Anyone may build a set with the set builder and price their own analysis runs on it. Only the CPUC registers a set for everyone,
      publishes it and pins it to a filing.
  how:
    - Build a set starts the set builder, from a copy of a set, a file or nothing.
    - Register as a draft takes a set's definition file; the engine here records its engine check at once; publish it from its page.
    - Managers review the sets Offered to the CPUC, then register one from its Review step or decline it with a reason.
  see: calculations
  tour:
    - heading: Every set
      title: Every set
      text: Each set with its program years, tests and status. Select one for its definition.
    - target: "#mine-h"
      title: My sets
      text: The sets you are building and those shared with your organization, with Build a set to start another.
    - target: "#offered-h"
      title: Offered to the CPUC
      text: For the CPUC's managers, the sets their builders offer for everyone.
      optional: true
    - target: "#reg-h"
      title: Register a set
      text: For CPUC system administrators. A set starts as a draft.
      optional: true

refdata/builder/start:
  title: Build a cost-test set
  guide:
    - Starts a set on the set builder. The usual start is a copy of a registered set (its file, with today's date as the new version),
      changed in a step or two. You can also copy one of your own sets or a set the engine ships, read in a set file you have (written by
      hand or downloaded; one with problems is still read in, and its problems shown), or start from a blank set.
    - Shared with your organization, the set can be opened and changed by its members who may start runs there.
  how:
    - Choose what to start from, pick the set or the file, and select Start.
  see: calculations
  tour:
    - heading: Start from
      title: Start from
      text: A copy of a set, a file, or a blank set.
    - target: "main form .actions"
      title: Start
      text: Opens the new set's first step.

refdata/builder/set:
  title: "Set builder: the set"
  guide:
    - The first step of a set being built. The id is made from the workstream, the first program year and an optional ending (EE-2028,
      EE-2028-neb); the version, usually a date, tells it from other files of the same id. A registered set's id and version name one file
      for good, so a changed set takes a new version.
    - The program years say when the set is in force. A draft is never published and never prices a filing.
    - The steps across the top show how many problems each has. Every save checks the whole set with the engine.
  how:
    - Change the fields and select Save and go on, or Save to stay on the step.
  see: calculations
  tour:
    - target: nav.subnav
      title: The steps
      text: Go to any step; each shows its open problems.
    - target: "#step-problems"
      title: Problems
      text: What the engine says is wrong with this part of the set.
      optional: true
    - heading: Id
      title: Id
      text: The workstream, the first program year and an optional ending make the set's id.
    - heading: Program years
      title: Program years
      text: The years the set is in force for; blank is open.

refdata/builder/pricings:
  title: "Set builder: pricings"
  guide:
    - A pricing says how a stream is priced for a test, which ACC rows and which discount rates, and the suffix its columns carry. The
      engine prices its own streams only on its own pricings; a pricing of your own is for streams from input columns and the program costs.
    - A pricing a stream, aggregate or test uses cannot be removed until they no longer use it.
  how:
    - Change a pricing's fields, tick Remove on one nothing uses, or fill in Add a pricing, then select Save.
  see: calculations
  tour:
    - target: nav.subnav
      title: The steps
      text: Go to any step; each shows its open problems.
    - heading: Pricing
      title: A pricing
      text: Its ACC rows, discount rates and column suffixes.
      optional: true
    - heading: Add a pricing
      title: Add a pricing
      text: A new pricing's id is typed once and cannot change.

refdata/builder/engine:
  title: "Set builder: streams the engine prices"
  guide:
    - The value streams the engine prices, from its own catalog. Include the ones the set's tests and aggregates read, choose the pricings
      each is read in (only those the engine prices it in are offered), and word its unit and definition. The name, kind, fuel, column
      naming and gross form are the engine's.
    - A value of the set's own, such as a non-energy benefit, is a stream from input columns, the next step.
  how:
    - Tick or untick Include, choose the pricings, change the unit and definition, then select Save.
  see: calculations
  tour:
    - target: nav.subnav
      title: The steps
      text: Go to any step; each shows its open problems.
    - target: "main form fieldset"
      title: A stream
      text: Include it, choose its pricings and word its definition.
      optional: true
    - heading: The program costs
      title: The program costs
      text: Part of every set and not changed here.
      optional: true

refdata/builder/inputs:
  title: "Set builder: streams from input columns"
  guide:
    - Values the set reads from Measure.csv columns, once or each year of the measure's life, scaled by NumUnits, the NTG and market
      effects. Non-energy benefits go here. A column that is not one of CET's is the set's own; a job without it prices it as 0.
  how:
    - Add a stream from input columns, or Change or Remove one in the list.
  see: calculations
  tour:
    - target: nav.subnav
      title: The steps
      text: Go to any step; each shows its open problems.
    - heading: The set's input streams
      title: The set's input streams
      text: What each reads and how it is counted.

refdata/builder/input_stream:
  title: "Set builder: a stream from input columns"
  guide:
    - One stream from input columns. Its name is the column it writes and the name tests use. It adds up the per-unit values of the
      Measure columns you choose (or name), times NumUnits and the NTG plus market effects, once or each year of the measure's life at the
      pricing's discount rates. A gross form lets a test with the Gross variant use it.
  how:
    - Fill in the fields and select Save the stream.
  see: calculations
  tour:
    - heading: Measure columns
      title: Measure columns
      text: The per-unit columns it adds up; name a new column of your own in the box.
    - heading: Gross form
      title: Gross form
      text: How the stream's gross form is made, for tests with the Gross variant.

refdata/builder/aggregates:
  title: "Set builder: aggregates"
  guide:
    - Columns that add up streams in one pricing, such as TotalSystemBenefit, written per measure. A set needs none; tests do not read
      them.
  how:
    - Add an aggregate, or Change or Remove one in the list.
  see: calculations
  tour:
    - target: nav.subnav
      title: The steps
      text: Go to any step; each shows its open problems.
    - heading: The set's aggregates
      title: The set's aggregates
      text: What each adds and takes away, and in which pricing.

refdata/builder/aggregate:
  title: "Set builder: an aggregate"
  guide:
    - One aggregate. Its name is the column it writes. It adds the streams you tick under Streams it adds and takes away those under
      Streams it takes away, each read in the pricing you choose. Ticking Also write it gross adds a column from each stream's gross form.
  how:
    - Fill in the fields and select Save the aggregate.
  see: calculations
  tour:
    - target: "#id_plus"
      title: Streams it adds
      text: Each stream with the pricings it is read in.

refdata/builder/tests:
  title: "Set builder: tests"
  guide:
    - The set's cost tests, in the order a run writes them and its pages show them. Each is a ratio of the streams it adds as benefits
      to those it adds as costs, read in its pricing, with a share of the program costs when it has one.
  how:
    - Add a test, or Change, Remove, or move a test Up or Down in the list.
  see: calculations
  tour:
    - target: nav.subnav
      title: The steps
      text: Go to any step; each shows its open problems.
    - heading: The set's tests
      title: The set's tests
      text: Each test's pricing, benefits, costs, program costs and variants, in order.

refdata/builder/test:
  title: "Set builder: a test"
  guide:
    - One cost test. Its id names its columns (TRCBen, TRCCost, TRCRatio). Tick its benefits and costs among the set's streams, each read
      in the test's pricing; choose how it takes the program costs (none, its own share of the program's positive benefits, or another
      test's share); and choose its variants and outputs.
  how:
    - Fill in the fields and select Save the test.
  see: calculations
  tour:
    - target: "#id_benefits"
      title: Benefits
      text: Each stream with the pricings it is read in.
    - heading: Outputs
      title: Outputs
      text: The lifecycle net benefit, levelized costs, headline and filing choices.

refdata/builder/review:
  title: "Set builder: review"
  guide:
    - The whole set, as the engine writes it out, with every problem left and a link to its step, and the set's file to download. An
      analysis run on New run takes the file as your own cost-test set.
    - A set copied from another one lists what changed since, part by part.
    - The CPUC's cost-test pack managers register a set with no problems as a draft pack; the engine installed here records its engine
      check at once, and it is published on its own page. A registered set no longer changes here; copy it to start the next version.
  how:
    - Download the set file, Copy it to a new set, or Discard it; managers Register as a draft pack.
    - Offer it to the CPUC with a note, when everyone could use it; Withdraw the offer while it waits. Managers Decline an offered set
      with a reason, which its builder is sent.
  see: calculations
  tour:
    - target: nav.subnav
      title: The steps
      text: Go to any step; each shows its open problems.
    - heading: Problems
      title: Problems
      text: Every problem left, by step.
    - heading: What changed
      title: What changed
      text: For a copied set, each part added, removed or changed since it was copied.
      optional: true
    - heading: The set in words
      title: The set in words
      text: Each test's benefits and costs as the engine adds them up.
      optional: true
    - heading: The file
      title: The file
      text: Download the set's YAML file.
    - heading: What next
      title: What next
      text: Register, copy or discard the set.
