{% if problems %}
<div class="alert" role="alert" tabindex="-1" id="problems">
  <p>Nothing was saved. Fix these:</p>
  <ul>{% for p in problems %}<li>{{ p }}</li>{% endfor %}</ul>
</div>
{% endif %}
  <div class="hscroll" tabindex="0" role="region" aria-label="Lines">
  <table class="list">
    <caption class="sr-only">Lines: PrgID, program year and amount</caption>
    <thead><tr><th scope="col">Line</th><th scope="col">PrgID</th><th scope="col">Program year</th><th scope="col">Amount ($)</th></tr></thead>
    <tbody>{% for r in rows %}<tr>
      <th scope="row">{{ forloop.counter }}</th>
      <td><label class="sr-only" for="prg-{{ forloop.counter }}">PrgID, line {{ forloop.counter }}</label><input id="prg-{{ forloop.counter }}" name="prg_id" value="{{ r.prg_id }}" list="programs" autocomplete="off" size="18"></td>
      <td><label class="sr-only" for="year-{{ forloop.counter }}">Program year, line {{ forloop.counter }}</label><select id="year-{{ forloop.counter }}" name="year"><option value="">Year</option>{% for y in years %}<option value="{{ y }}"{% if y == r.year %} selected{% endif %}>{{ y }}</option>{% endfor %}</select></td>
      <td><label class="sr-only" for="amount-{{ forloop.counter }}">Amount in dollars, line {{ forloop.counter }}</label><input id="amount-{{ forloop.counter }}" name="amount" value="{{ r.amount }}" inputmode="decimal" size="14"></td>
    </tr>{% endfor %}</tbody>
  </table>
  </div>
  <datalist id="programs">{% for prg, name in programs %}<option value="{{ prg }}">{{ name }}</option>{% endfor %}</datalist>
